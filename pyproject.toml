[build-system]
requires=['setuptools>=68','wheel']
build-backend='setuptools.build_meta'
[project]
name='ragforge-platform'
version='0.1.0'
requires-python='>=3.12'
dependencies=['fastapi>=0.115,<1','uvicorn[standard]>=0.30,<1','pydantic-settings>=2.4,<3','psycopg[binary]>=3.2,<4','pgvector>=0.3,<1']
[project.optional-dependencies]
dev=['pytest>=8,<9','ruff>=0.6,<1']
[tool.setuptools.packages.find]
include=['app*']
[tool.ruff]
exclude = ['build', '*.egg-info', '.venv']
[tool.ruff.lint]
ignore = ['EXE002']
